name: Test data
description: Fetch the reference data of the parity tests (cached) and export where the test suites find it.

runs:
  using: composite
  steps:
    - name: Restore cached test data
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.ci-data
        key: test-data-${{ hashFiles('tests/parity/fetch_data.sh') }}

    - name: Fetch test data
      shell: bash
      run: tests/parity/fetch_data.sh "$GITHUB_WORKSPACE/.ci-data"

    - name: Export the data locations
      shell: bash
      run: |
        {
          echo "MYMYR_PARITY_DATA=$GITHUB_WORKSPACE/.ci-data"
        } >> "$GITHUB_ENV"
