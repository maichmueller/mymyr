name: CUDA wheels

# CUDA wheels for Linux x86_64 (manylinux_2_34, version <version>+cu13), one per CPython ABI, with SASS for compute
# capabilities 8.6, 8.9 and 9.0. ci/cuda_wheel.sh builds each in the manylinux image of the CPU wheels and tests it
# with the CPU suite; hosted runners have no GPU, so the wheels stay workflow artifacts named cuda-wheel-<abi> (never
# dist-*: the PyPI jobs do not see them) until ci/attach_cuda_wheels.sh tests them on a GPU and attaches them to the
# GitHub Release. The release workflow calls this workflow for every v* tag; a manual run builds a tag or the branch
# it is started on.
#
# Every architecture compiles the device code once more (about 1.5 hours each on a hosted runner), so one job cannot
# build three of them within the job time limit. Each ABI takes two jobs: "compile" builds until a time limit, stops
# the build cleanly and hands the build tree and the toolchain on as an artifact; "wheel" resumes the build where it
# stopped (Ninja compiles only what is missing), then repairs, checks and tests the wheel.
#
# The toolchain (GCC 16, the dependency superbuild and the CUDA compiler) is cached. A tag can restore only the
# caches of its own ref and of the default branch, so the cache is saved on main only: by the toolchain job, on a
# push to main that changes the toolchain's inputs and on a manual run on main. Tag runs restore it by key and never
# save it; without it they build the toolchain in the compile job.
on:
  push:
    branches: [main]
    paths:
      - ci/wheel_toolchain.sh
      - dependencies/CMakeLists.txt
      - ci/cuda_redist.json
      - ci/install_cuda_redist.py
      - .github/workflows/cuda-wheels.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (empty for the branch of the run)
        type: string
        default: ""
      python:
        description: CPython ABIs, space-separated
        type: string
        default: cp314t cp315t
      archs:
        description: CUDA architectures (CMAKE_CUDA_ARCHITECTURES)
        type: string
        default: 86-real;89-real;90-real
  workflow_call:
    inputs:
      tag:
        description: Release tag to build
        type: string
        required: true
      python:
        description: CPython ABIs, space-separated
        type: string
        default: cp314t cp315t
      archs:
        description: CUDA architectures (CMAKE_CUDA_ARCHITECTURES)
        type: string
        default: 86-real;89-real;90-real

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  toolchain:
    name: CUDA wheel toolchain
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the toolchain
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ci-toolchain
          key: cuda-wheel-toolchain-linux-${{ hashFiles('ci/wheel_toolchain.sh', 'dependencies/CMakeLists.txt', 'ci/cuda_redist.json', 'ci/install_cuda_redist.py') }}
      - name: Install the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          image=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["cibuildwheel"]["linux"]["manylinux-x86_64-image"])')
          mkdir -p .ci-toolchain "$RUNNER_TEMP/cuda-wheel"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$GITHUB_WORKSPACE/.ci-toolchain:/opt/mymyr-toolchain" \
            --volume "$RUNNER_TEMP/cuda-wheel:/work" \
            "$image" \
            bash /src/ci/cuda_wheel.sh --stage toolchain --work /work

  abis:
    name: ABI matrix
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.abis.outputs.python }}
    steps:
      - name: List the ABIs
        id: abis
        env:
          PYTHON_ABIS: ${{ inputs.python }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          abis = os.environ["PYTHON_ABIS"].split()
          if not abis or not all(re.fullmatch(r"cp3[0-9]{2}t?", abi) for abi in abis):
              sys.exit(f"error: expected CPython ABIs such as cp314t, got {abis}")
          print(f"python={json.dumps(abis)}")
          EOF

  compile:
    name: CUDA wheel, ${{ matrix.python }}, compile
    # after the toolchain job of a manual run on main, so that the compile restores its cache
    needs: [abis, toolchain]
    if: ${{ !cancelled() && needs.abis.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.abis.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Check the tag against the package version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: python3 ci/check_release_version.py "$TAG"
      # the build tree takes several GB per architecture, and its archive as much again; the runner image's
      # Android SDK, .NET and GHC are unused
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Restore the toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ci-toolchain
          key: cuda-wheel-toolchain-linux-${{ hashFiles('ci/wheel_toolchain.sh', 'dependencies/CMakeLists.txt', 'ci/cuda_redist.json', 'ci/install_cuda_redist.py') }}
      # stops 270 minutes after the start of the script, which leaves the time to archive and upload the build tree
      - name: Compile
        env:
          PYTHON_ABI: ${{ matrix.python }}
          CUDA_ARCHS: ${{ inputs.archs }}
        run: |
          image=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["cibuildwheel"]["linux"]["manylinux-x86_64-image"])')
          mkdir -p .ci-toolchain "$RUNNER_TEMP/cuda-wheel"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$GITHUB_WORKSPACE/.ci-toolchain:/opt/mymyr-toolchain" \
            --volume "$RUNNER_TEMP/cuda-wheel:/work" \
            "$image" \
            bash /src/ci/cuda_wheel.sh --stage compile --minutes 270 --python "$PYTHON_ABI" --archs "$CUDA_ARCHS" \
              --out /src/wheelhouse --work /work --jobs 4 --cuda-jobs 2
          df -h /
      # tar keeps the modification times, which tell Ninja what is up to date; the files belong to the container's
      # root. Parts of 2 GB keep every file of the artifact small.
      - name: Archive the build tree and the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/build-state"
          sudo tar -C "$GITHUB_WORKSPACE" -cf - .ci-toolchain | zstd -q -T0 -3 \
            | split -b 2G - "$RUNNER_TEMP/build-state/toolchain.tar.zst."
          sudo tar -C "$RUNNER_TEMP" --exclude=cuda-wheel/cache --exclude=cuda-wheel/tmp -cf - cuda-wheel \
            | zstd -q -T0 -3 | split -b 2G - "$RUNNER_TEMP/build-state/work.tar.zst."
          sudo rm -rf "$RUNNER_TEMP/cuda-wheel"
          ls -l "$RUNNER_TEMP/build-state"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-wheel-build-${{ matrix.python }}
          path: ${{ runner.temp }}/build-state
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  wheel:
    name: CUDA wheel, ${{ matrix.python }}
    needs: [abis, compile]
    # per ABI: a wheel whose compile failed finds no build tree and fails, the others go on
    if: ${{ !cancelled() && needs.abis.result == 'success' && needs.compile.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.abis.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cuda-wheel-build-${{ matrix.python }}
          path: ${{ runner.temp }}/build-state
      - name: Restore the build tree and the toolchain
        run: |
          cat "$RUNNER_TEMP"/build-state/toolchain.tar.zst.* | zstd -q -d | sudo tar -C "$GITHUB_WORKSPACE" -xf -
          cat "$RUNNER_TEMP"/build-state/work.tar.zst.* | zstd -q -d | sudo tar -C "$RUNNER_TEMP" -xf -
          rm -rf "$RUNNER_TEMP/build-state"
          df -h /
      - name: Finish, check and test the wheel
        env:
          PYTHON_ABI: ${{ matrix.python }}
          CUDA_ARCHS: ${{ inputs.archs }}
        run: |
          image=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["cibuildwheel"]["linux"]["manylinux-x86_64-image"])')
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$GITHUB_WORKSPACE/.ci-toolchain:/opt/mymyr-toolchain" \
            --volume "$RUNNER_TEMP/cuda-wheel:/work" \
            "$image" \
            bash /src/ci/cuda_wheel.sh --stage finish --python "$PYTHON_ABI" --archs "$CUDA_ARCHS" \
              --out /src/wheelhouse --work /work --jobs 4 --cuda-jobs 2
          ls -l wheelhouse
          df -h /
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-wheel-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          # a wheel is already compressed
          compression-level: 0
