name: Release

# Tags create a GitHub Release and publish to TestPyPI, then PyPI. A manual run builds a unique development version
# and publishes only to TestPyPI. The CUDA wheels of a release are built outside this workflow, by
# ci/local_cuda_wheels.sh on a large Linux host or by a manual run of cuda-wheels.yml, and ci/attach_cuda_wheels.sh
# tests them on a GPU and attaches them to the GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the package version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the release or rehearsal version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 ci/set_rehearsal_version.py "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          else
            python3 ci/check_release_version.py "$GITHUB_REF_NAME"
          fi

  wheels:
    name: Wheels and sdist
    needs: check
    uses: ./.github/workflows/wheels.yml
    with:
      macos: true
      rehearsal-version: ${{ github.event_name == 'workflow_dispatch' && needs.check.outputs.version || '' }}
    permissions:
      contents: read

  verify:
    name: Check every distribution
    needs: [check, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the rehearsal version
        if: github.event_name == 'workflow_dispatch'
        env:
          REHEARSAL_VERSION: ${{ needs.check.outputs.version }}
        run: python3 ci/set_rehearsal_version.py --version "$REHEARSAL_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check the filenames, metadata and complete wheel matrix
        env:
          PACKAGE_VERSION: ${{ needs.check.outputs.version }}
        run: python3 ci/check_release_version.py "v$PACKAGE_VERSION" dist

  github-release:
    name: GitHub Release
    needs: [check, wheels, verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Every artifact carries the tag's version
        run: |
          ls -l dist
          python3 ci/check_release_version.py "$GITHUB_REF_NAME" dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          generate_release_notes: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [check, wheels, verify, github-release]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.github-release.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mymyr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  test-testpypi:
    name: Install the rehearsal from TestPyPI
    needs: [check, publish-testpypi]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.publish-testpypi.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.6
          enable-cache: false
      - name: Install and import the uploaded wheel
        env:
          REHEARSAL_VERSION: ${{ needs.check.outputs.version }}
        run: |
          uv venv --python 3.14 --seed .venv
          for attempt in {1..12}; do
            if .venv/bin/python -m pip install --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ \
              "mymyr==$REHEARSAL_VERSION"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then exit 1; fi
            sleep 10
          done
          .venv/bin/python -c 'import importlib.metadata as m, os, mymyr; expected = os.environ["REHEARSAL_VERSION"]; assert mymyr.__version__ == m.version("mymyr") == expected; print(mymyr.build_info())'

  publish-pypi:
    name: Publish to PyPI
    needs: [check, wheels, verify, github-release, publish-testpypi]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.verify.result == 'success' && needs.github-release.result == 'success' && needs.publish-testpypi.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/mymyr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
